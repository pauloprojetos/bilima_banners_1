<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='UTF-8'>
  <style>
    body, html { margin:0; padding:0; height:100%; width:100%; overflow:hidden; }
    #frame { width:100%; height:90%; border:none; }
    #dots { width:100%; height:10%; display:flex; justify-content:center; align-items:center; background:#f9f9f9; }
    .dot { width:12px; height:12px; margin:0 6px; background:#bbb; border-radius:50%; cursor:pointer; transition: background 0.3s; }
    .dot.active { background:#444; }
  </style>
</head>
<body>
  <iframe id='frame' src='' ></iframe>
  <div id='dots'></div>

  <script>
    // → PARÂMETROS EDITÁVEIS (coloque novo link, label, tempo em ms)
    const slides = [
      { url: 'https://app.powerbi.com/view?r=eyJrIjoiYjc4OTkyODAtZTA2NC00YjE5LWFiMDktMTcwOWY4ZmNiZDNhIiwidCI6IjQ2OGE3ZDg3LTM5ZGMtNDk5MC1iN2VjLTFmNjIzNjEwMDI1MiJ9&pageName=743a25d1b0074a83cad7', label: 'Banner 1', tempo: 5000 },
      { url: 'https://app.powerbi.com/view?r=eyJrIjoiYjc4OTkyODAtZTA2NC00YjE5LWFiMDktMTcwOWY4ZmNiZDNhIiwidCI6IjQ2OGE3ZDg3LTM5ZGMtNDk5MC1iN2VjLTFmNjIzNjEwMDI1MiJ9&pageName=30d03ce634bca05c4993', label: 'Banner 2', tempo: 5000 }
    ];
    // ← fim dos parâmetros

    let currentIndex = 0;
    let timer;

    function buildDots(){
      const d = document.getElementById('dots');
      slides.forEach((s,i)=>{
        const dot = document.createElement('span');
        dot.classList.add('dot');
        dot.title = s.label;
        dot.addEventListener('click', ()=>{
          goToSlide(i);
        });
        d.appendChild(dot);
      });
    }

    function updateDots(){
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot,i)=>{
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    function startSlide(index){
      currentIndex = index;
      const slide = slides[currentIndex];
      document.getElementById('frame').src = slide.url;
      updateDots();
      clearTimeout(timer);
      timer = setTimeout(()=>{
        const next = (currentIndex + 1) % slides.length;
        startSlide(next);
      }, slide.tempo);
    }

    function goToSlide(index){
      startSlide(index);
    }

    window.onload = ()=>{
      buildDots();
      startSlide(0);
    };
  </script>

</body>
</html>
