<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrossel de Banners</title>

  <!-- ░░░ PARÂMETROS EDITÁVEIS ░░░ -->
  <script>
    // Aqui você define seus banners: url, rótulo, tempo em milissegundos
    const SLIDES = [
      { url: "https://app.powerbi.com/view?r=eyJrIjoiYjc4OTkyODAtZTA2NC00YjE5LWFiMDktMTcwOWY4ZmNiZDNhIiwidCI6IjQ2OGE3ZDg3LTM5ZGMtNDk5MC1iN2VjLTFmNjIzNjEwMDI1MiJ9&pageName=743a25d1b0074a83cad7",   label: "Promoção 1", tempo: 5000 },
      { url: "https://app.powerbi.com/view?r=eyJrIjoiYjc4OTkyODAtZTA2NC00YjE5LWFiMDktMTcwOWY4ZmNiZDNhIiwidCI6IjQ2OGE3ZDg3LTM5ZGMtNDk5MC1iN2VjLTFmNjIzNjEwMDI1MiJ9&pageName=30d03ce634bca05c4993",   label: "Promoção 2", tempo: 5000 }
    ];
    const IFRAME_HEIGHT_PERCENT = 90;     // Altura do iframe em % da tela (deixe 90 ou ajuste)
    const DOT_SIZE_PX = 14;               // Tamanho das bolinhas em px
    const DOT_MARGIN_PX = 8;              // Espaço entre bolinhas
  </script>
  <!-- ░░░ FIM DOS PARÂMETROS EDITÁVEIS ░░░ -->

  <style>
    body, html { margin:0; padding:0; height:100%; width:100%; background:#fff; }
    #slideFrame { width:100%; height: calc(100% * (IFRAME_HEIGHT_PERCENT/100)); border:none; }
    #controlDots { width:100%; height: calc(100% * ((100-IFRAME_HEIGHT_PERCENT)/100)); display:flex; justify-content:center; align-items:center; background:#f9f9f9; }
    .dot { width: DOT_SIZE_PXpx; height: DOT_SIZE_PXpx; margin:0 DOT_MARGIN_PXpx; background:#bbb; border-radius:50%; display:inline-block; cursor:pointer; transition: background 0.3s; }
    .dot.active { background:#444; }
  </style>
</head>
<body>

  <iframe id="slideFrame" src="" frameborder="0"></iframe>
  <div id="controlDots"></div>

  <script>
    let slides = SLIDES;
    let currentIndex = 0;
    let timer;

    function buildDots() {
      const container = document.getElementById('controlDots');
      slides.forEach((s, i) => {
        const dot = document.createElement('span');
        dot.classList.add('dot');
        dot.title = s.label;
        dot.addEventListener('click', () => {
          goToSlide(i);
        });
        container.appendChild(dot);
      });
    }

    function updateDots() {
      const dots = document.querySelectorAll('.dot');
      dots.forEach((d, i) => {
        d.classList.toggle('active', i === currentIndex);
      });
    }

    function startSlide(index) {
      if (slides.length === 0) return;
      currentIndex = index;
      const slide = slides[currentIndex];
      document.getElementById('slideFrame').src = slide.url;
      updateDots();
      clearTimeout(timer);
      timer = setTimeout(() => {
        const nextIndex = (currentIndex + 1) % slides.length;
        startSlide(nextIndex);
      }, slide.tempo);
    }

    function goToSlide(index) {
      startSlide(index);
    }

    window.onload = () => {
      buildDots();
      startSlide(0);
    };
  </script>

</body>
</html>
